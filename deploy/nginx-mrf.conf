# Nginx site for 172.22.6.98 — serves the built SPA and reverse-proxies /api
# to the FastAPI backend on the same host. Then the frontend needs NO
# VITE_API_BASE_URL (same origin).
#
#   sudo cp deploy/nginx-mrf.conf /etc/nginx/sites-available/mrf
#   sudo ln -s /etc/nginx/sites-available/mrf /etc/nginx/sites-enabled/mrf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 172.22.6.98;

    # large MRF uploads stream through here
    client_max_body_size 30g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    root /opt/mrf-dashboard/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;   # stream chunk uploads straight through
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
